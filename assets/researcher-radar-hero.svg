<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title description">
  <title id="title">ResearcherRadar · 科研雷达</title>
  <desc id="description">蓝色文献雷达扫描期刊来源，整理关键词证据并连接 Zotero 文献库的示意横幅。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091b30"/>
      <stop offset="0.58" stop-color="#10304f"/>
      <stop offset="1" stop-color="#143b59"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#25d6c8" stop-opacity="0"/>
      <stop offset="1" stop-color="#25d6c8" stop-opacity="0.34"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f8cff"/>
      <stop offset="1" stop-color="#25d6c8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#03101e" flood-opacity="0.3"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#92c7e9" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1440" height="480" rx="28" fill="url(#background)"/>
  <rect width="1440" height="480" rx="28" fill="url(#grid)"/>
  <circle cx="1130" cy="236" r="256" fill="#1e5b78" opacity="0.15"/>

  <g transform="translate(86 76)">
    <circle cx="34" cy="34" r="33" fill="#153e5c" stroke="#25d6c8" stroke-width="2"/>
    <circle cx="34" cy="34" r="21" fill="none" stroke="#79eadb" stroke-opacity="0.65"/>
    <circle cx="34" cy="34" r="10" fill="none" stroke="#79eadb" stroke-opacity="0.8"/>
    <path d="M34 34 53 16" stroke="#25d6c8" stroke-linecap="round" stroke-width="3"/>
    <circle cx="34" cy="34" r="3.5" fill="#25d6c8"/>
    <text x="90" y="27" fill="#94dff0" font-size="17" font-weight="700" letter-spacing="2" font-family="Arial, sans-serif">RESEARCH WORKFLOW</text>
    <text x="90" y="60" fill="#ffffff" font-size="28" font-weight="700" font-family="Arial, sans-serif">科研雷达</text>
  </g>

  <text x="88" y="213" fill="#ffffff" font-size="58" font-weight="750" font-family="Arial, sans-serif">ResearcherRadar</text>
  <rect x="88" y="238" width="78" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="88" y="287" fill="#c9e7f2" font-size="23" font-family="Arial, sans-serif">从期刊新论文，到更值得读的研究清单</text>

  <g font-family="Arial, sans-serif" font-size="17" font-weight="600">
    <rect x="88" y="325" width="126" height="42" rx="21" fill="#2f8cff" fill-opacity="0.17" stroke="#2f8cff" stroke-opacity="0.55"/>
    <text x="110" y="352" fill="#d3eaff">RSS 追踪</text>
    <rect x="227" y="325" width="139" height="42" rx="21" fill="#25d6c8" fill-opacity="0.13" stroke="#25d6c8" stroke-opacity="0.55"/>
    <text x="250" y="352" fill="#c9f6ee">证据评分</text>
    <rect x="379" y="325" width="152" height="42" rx="21" fill="#7c6cff" fill-opacity="0.15" stroke="#9d93ff" stroke-opacity="0.55"/>
    <text x="400" y="352" fill="#e4dfff">Zotero 整理</text>
  </g>

  <g transform="translate(957 235)">
    <circle r="194" fill="none" stroke="#56b9db" stroke-opacity="0.16" stroke-width="2"/>
    <circle r="151" fill="none" stroke="#56b9db" stroke-opacity="0.24" stroke-width="2"/>
    <circle r="108" fill="none" stroke="#56b9db" stroke-opacity="0.34" stroke-width="2"/>
    <circle r="66" fill="none" stroke="#56b9db" stroke-opacity="0.45" stroke-width="2"/>
    <path d="M0 0 155 -118 A194 194 0 0 1 194 0Z" fill="url(#beam)"/>
    <path d="M0 0 168 -98" stroke="#25d6c8" stroke-opacity="0.8" stroke-width="2"/>
    <circle cx="151" cy="-108" r="5" fill="#25d6c8"/>
    <circle cx="88" cy="-54" r="4" fill="#65bcff"/>
    <circle cx="-118" cy="30" r="5" fill="#65bcff"/>
    <circle cx="32" cy="132" r="5" fill="#9e93ff"/>
    <circle r="6" fill="#25d6c8"/>
  </g>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="1064" y="88" width="300" height="102" rx="16" fill="#f7fbff"/>
    <rect x="1084" y="108" width="62" height="24" rx="12" fill="#d9edff"/>
    <text x="1100" y="125" fill="#1769d8" font-size="12" font-weight="700">RSS</text>
    <rect x="1084" y="147" width="218" height="9" rx="4.5" fill="#cfdeeb"/>
    <rect x="1084" y="164" width="164" height="7" rx="3.5" fill="#e1eaf2"/>

    <rect x="1103" y="216" width="300" height="105" rx="16" fill="#f7fbff"/>
    <circle cx="1134" cy="247" r="13" fill="#d9f8f3"/>
    <path d="m1128 247 4 4 8-9" fill="none" stroke="#0b9b8a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1157" y="239" width="186" height="9" rx="4.5" fill="#9dc5e9"/>
    <rect x="1123" y="278" width="229" height="8" rx="4" fill="#d4e2ee"/>
    <rect x="1123" y="295" width="158" height="7" rx="3.5" fill="#e4edf4"/>

    <rect x="1033" y="347" width="260" height="79" rx="16" fill="#f7fbff"/>
    <rect x="1053" y="366" width="38" height="38" rx="10" fill="#e8e4ff"/>
    <path d="M1062 378h20M1062 384h20M1062 390h13" stroke="#7466dc" stroke-width="2" stroke-linecap="round"/>
    <rect x="1107" y="372" width="143" height="8" rx="4" fill="#abc5db"/>
    <rect x="1107" y="390" width="111" height="7" rx="3.5" fill="#e0e9f1"/>
  </g>
</svg>
